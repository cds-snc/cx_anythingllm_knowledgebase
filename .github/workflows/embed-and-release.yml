name: Embed and Release

# Runs weekly, on document changes, or manually.
# Converts source documents to markdown, embeds them, and publishes a storage snapshot.
on:
  schedule:
    - cron: '0 13 * * 1'   # Monday 8am ET (UTC-5 = 13:00 UTC)
  push:
    branches: [main]
    paths:
      - 'documents/**'
  workflow_dispatch:        # Manual trigger from Actions tab
    inputs:
      version_tag:
        description: 'Release tag (default: v<date>)'
        required: false
        type: string

jobs:
  embed-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version tag
        id: tag
        run: |
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date +%Y-%m-%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion dependencies
        run: pip install -r requirements.txt

      - name: Convert documents to markdown
        run: python3 scripts/convert_documents.py

      - name: Commit converted markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/corpus-md/
          if git diff --cached --quiet; then
            echo "No new markdown files to commit"
          else
            git commit -m "corpus: auto-convert new documents to markdown"
            git push
          fi

      - name: Start AnythingLLM
        env:
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          # Write .env for Docker
          cat > .env << EOF
          SERVER_PORT=3001
          STORAGE_DIR=/app/server/storage
          SIG_KEY='$(openssl rand -hex 32)'
          SIG_SALT='$(openssl rand -hex 32)'
          JWT_SECRET="$(openssl rand -hex 24)"
          LLM_PROVIDER=azure
          AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
          AZURE_OPENAI_APIKEY=${AZURE_OPENAI_KEY}
          OPEN_AI_KEY=${AZURE_OPENAI_KEY}
          OPEN_MODEL_PREF=gpt-4o
          AZURE_OPENAI_MODEL_VERSION=2024-08-01-preview
          EMBEDDING_ENGINE=native
          VECTOR_DB=lancedb
          WHISPER_PROVIDER=local
          TTS_PROVIDER=native
          DISABLE_SWAGGER_DOCS=true
          EOF

          mkdir -p storage
          chmod 777 storage

          # Pull and start AnythingLLM
          docker pull mintplexlabs/anythingllm:latest
          docker run -d \
            --name anythingllm \
            -p 3001:3001 \
            --cap-add SYS_ADMIN \
            -v "${{ github.workspace }}/storage:/app/server/storage" \
            -v "${{ github.workspace }}/.env:/app/server/.env" \
            -e STORAGE_DIR=/app/server/storage \
            mintplexlabs/anythingllm:latest

          # Wait for startup (up to 3 minutes)
          echo "Waiting for AnythingLLM to start..."
          STARTED=false
          for i in $(seq 1 36); do
            if curl -sf http://localhost:3001/api/ping | grep -q '"online":true'; then
              echo "AnythingLLM is up"
              STARTED=true
              break
            fi
            # Check if container crashed
            if ! docker ps --filter name=anythingllm --format '{{.Status}}' | grep -q Up; then
              echo "ERROR: Container crashed. Logs:"
              docker logs anythingllm --tail 50
              exit 1
            fi
            sleep 5
          done
          if [ "$STARTED" != "true" ]; then
            echo "ERROR: AnythingLLM did not become healthy. Logs:"
            docker logs anythingllm --tail 50
            exit 1
          fi

      - name: Create API key
        id: apikey
        run: |
          # AnythingLLM generates no API key on fresh start.
          # Create one directly via Prisma (createdBy is nullable, no FK).
          API_KEY=$(docker exec anythingllm node -e "
            const { PrismaClient } = require('/app/server/node_modules/@prisma/client');
            const crypto = require('crypto');
            const p = new PrismaClient();
            (async () => {
              let key = await p.api_keys.findFirst();
              if (!key) {
                const secret = 'sk-' + crypto.randomBytes(16).toString('hex');
                key = await p.api_keys.create({ data: { secret } });
              }
              console.log(key.secret);
              await p.\$disconnect();
            })();
          ")
          echo "::add-mask::$API_KEY"
          echo "key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "API key ready"

      - name: Configure workspace via API
        env:
          ANYTHING_LLM_URL: http://localhost:3001
          API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          WORKSPACES=$(curl -s "${ANYTHING_LLM_URL}/api/v1/workspaces" \
            -H "Authorization: Bearer ${API_KEY}" 2>/dev/null || echo '{"workspaces":[]}')

          HAS_WORKSPACE=$(echo "$WORKSPACES" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          names = [w.get('name','') for w in data.get('workspaces', [])]
          print('yes' if 'Research' in names else 'no')
          " 2>/dev/null || echo "unknown")

          if [ "$HAS_WORKSPACE" != "yes" ]; then
            echo "Creating Research workspace..."
            curl -s -X POST "${ANYTHING_LLM_URL}/api/v1/workspace/new" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${API_KEY}" \
              -d '{"name": "Research", "chatMode": "query"}' || true
          else
            echo "Research workspace already exists"
          fi

      - name: Upload markdown corpus
        env:
          ANYTHING_LLM_URL: http://localhost:3001
          API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          # Upload converted markdown files (not raw source documents)
          WORKSPACE_SLUG="research"
          UPLOADED=0
          FAILED=0

          for f in docs/corpus-md/*.md; do
            [ -f "$f" ] || continue

            FILENAME=$(basename "$f")
            echo "Uploading: $FILENAME"

            RESPONSE=$(curl -s -X POST "${ANYTHING_LLM_URL}/api/v1/document/upload" \
              -H "Authorization: Bearer ${API_KEY}" \
              -F "file=@$f" 2>/dev/null || echo '{"success":false}')

            SUCCESS=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success', False))" 2>/dev/null || echo "False")

            if [ "$SUCCESS" = "True" ]; then
              UPLOADED=$((UPLOADED + 1))

              DOC_LOCATION=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          docs = data.get('documents', [])
          if docs: print(docs[0].get('location', ''))
          " 2>/dev/null || echo "")

              if [ -n "$DOC_LOCATION" ]; then
                curl -s -X POST "${ANYTHING_LLM_URL}/api/v1/workspace/${WORKSPACE_SLUG}/update-embeddings" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${API_KEY}" \
                  -d "{\"adds\": [\"$DOC_LOCATION\"], \"deletes\": []}" || true
              fi
            else
              FAILED=$((FAILED + 1))
              echo "  FAILED: $FILENAME"
            fi
          done

          echo ""
          echo "Upload complete: $UPLOADED uploaded, $FAILED failed"

      - name: Wait for embedding to complete
        run: |
          echo "Waiting 30s for embedding to complete..."
          sleep 30

      - name: Package storage snapshot
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "$TAG" > storage/.release-tag

          tar -czf "storage-${TAG}.tar.gz" \
            --exclude="storage/logs" \
            --exclude="storage/*.log" \
            --exclude="storage/tmp" \
            storage/

          SIZE=$(du -sh "storage-${TAG}.tar.gz" | cut -f1)
          echo "Snapshot: storage-${TAG}.tar.gz ($SIZE)"
          echo "artifact_path=storage-${TAG}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Delete existing release with same tag if present
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            "storage-${TAG}.tar.gz" \
            --title "Knowledge Base ${TAG}" \
            --notes "Embedded corpus snapshot. Run \`./scripts/update.sh\` to apply to your local instance." \
            --repo cds-snc/cx_anythingllm_knowledgebase

          echo "Released: $TAG"
